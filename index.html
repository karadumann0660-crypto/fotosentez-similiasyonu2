<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Fotosentez Mekanizması & Calvin Döngüsü</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; overflow: hidden; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #03120e; color: #fff; }
        #canvas-container { width: 100vw; height: 100vh; display: block; }
        #ui-panel {
            position: absolute; top: 15px; left: 15px; width: 320px; max-height: calc(100vh - 30px); overflow-y: auto;
            background: rgba(8, 28, 21, 0.93); backdrop-filter: blur(12px);
            padding: 18px; border-radius: 14px; border: 1px solid rgba(74, 222, 128, 0.35);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7); z-index: 10;
        }
        #info-box {
            position: absolute; top: 15px; right: 15px; width: 300px;
            background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(12px);
            padding: 16px; border-radius: 14px; border: 1px solid rgba(56, 189, 248, 0.4);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8); z-index: 10; display: none;
        }
        #info-box h3 { margin-top: 0; font-size: 1rem; color: #38bdf8; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 6px; }
        #info-box p { font-size: 0.82rem; color: #cbd5e1; line-height: 1.4; margin-bottom: 0; }
        #info-close { position: absolute; top: 10px; right: 12px; cursor: pointer; color: #94a3b8; font-weight: bold; font-size: 0.9rem; }
        #info-close:hover { color: #fff; }
        h2 { margin-top: 0; font-size: 1.1rem; color: #4ade80; text-transform: uppercase; letter-spacing: 1px; text-align: center; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 8px; }
        .control-group { margin-bottom: 12px; }
        label { display: flex; justify-content: space-between; font-size: 0.8rem; margin-bottom: 4px; color: #cbd5e1; }
        input[type=range], select { width: 100%; cursor: pointer; accent-color: #22c55e; }
        select { background: #0f291e; color: #fff; border: 1px solid rgba(255,255,255,0.2); padding: 6px; border-radius: 6px; }
        .btn-group { display: flex; gap: 8px; margin-bottom: 12px; }
        .btn { flex: 1; padding: 8px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; background: #15803d; color: #fff; transition: 0.2s; }
        .btn:hover { background: #22c55e; }
        .metric-group { background: rgba(0,0,0,0.4); padding: 12px; border-radius: 8px; margin-top: 10px; }
        .metric { display: flex; justify-content: space-between; font-size: 0.82rem; margin-bottom: 6px; }
        .metric-val { color: #38bdf8; font-weight: bold; }
        .stage-title { font-size: 0.78rem; color: #facc15; font-weight: bold; margin-top: 8px; margin-bottom: 4px; border-top: 1px dashed rgba(255,255,255,0.15); padding-top: 6px; }
        #instructions {
            position: absolute; bottom: 15px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.8); padding: 8px 16px; border-radius: 20px; font-size: 0.8rem; color: #86efac; border: 1px solid rgba(34,197,94,0.3); pointer-events: none;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
    <div id="canvas-container"></div>
    <div id="ui-panel">
        <h2>3D Fotosentez Mekanizması</h2>

        <div class="btn-group">
            <button class="btn" id="dayNightBtn">🌙 Gece Modu</button>
        </div>
        
        <div class="control-group">
            <label><span>Işık Şiddeti:</span> <span id="light-val">60%</span></label>
            <input type="range" id="lightSlider" min="0" max="100" value="60">
        </div>

        <div class="control-group">
            <label>Işık Türü / Spektrum:</label>
            <select id="lightColorSelect">
                <option value="680">Kırmızı Işık (680nm - Yüksek Verim)</option>
                <option value="450">Mavi Işık (450nm - Yüksek Verim)</option>
                <option value="530">Yeşil Işık (530nm - Düşük Verim)</option>
                <option value="580">Sarı Işık (580nm - Orta Verim)</option>
                <option value="white">Güneş Işığı (Beyaz Spektrum)</option>
            </select>
        </div>

        <div class="control-group">
            <label><span>Sıcaklık:</span> <span id="temp-val">25°C</span></label>
            <input type="range" id="tempSlider" min="0" max="50" value="25">
        </div>

        <div class="control-group">
            <label><span>CO₂ Miktarı (Calvin):</span> <span id="co2-val">50%</span></label>
            <input type="range" id="co2Slider" min="0" max="100" value="50">
        </div>

        <div class="metric-group">
            <div class="metric"><span>Fotosentez Hızı:</span> <span id="rateVal" class="metric-val">%0</span></div>
            <div class="stage-title">Işığa Bağımlı Evre</div>
            <div class="metric"><span>ETS Elektron Akışı:</span> <span id="etsVal" class="metric-val" style="color:#eab308;">Aktif (e⁻ Akıyor)</span></div>
            <div class="stage-title">Işıktan Bağımsız Evre</div>
            <div class="metric"><span>Harcanan ATP / NADPH:</span> <span id="atpVal" class="metric-val">0 / 0</span></div>
            <div class="metric"><span>Üretilen Glikoz:</span> <span id="glucoseVal" class="metric-val">0.0 mg</span></div>
        </div>
    </div>

    <!-- TIKLAYINCA AÇILAN BİLGİ KUTUSU -->
    <div id="info-box">
        <span id="info-close">&times;</span>
        <h3 id="info-title">Yapı Adı</h3>
        <p id="info-desc">Açıklama buraya gelecek.</p>
    </div>

    <div id="instructions">Ekranda gördüğünüz yapılara fare ile TIKLAYARAK bilgi alabilirsiniz.</div>

    <script>
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x03120e);
        scene.fog = new THREE.FogExp2(0x03120e, 0.02);

        let isNight = false;

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 3, 11);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        const ambientLight = new THREE.AmbientLight(0x14532d, 0.85);
        scene.add(ambientLight);

        const lightSource = new THREE.PointLight(0xef4444, 2.8, 60);
        lightSource.position.set(0, 12, 4);
        scene.add(lightSource);

        const clickableObjects = [];

        // 1. KLOROPLAST KABUĞU
        const chloroGeo = new THREE.SphereGeometry(3.2, 32, 16);
        chloroGeo.scale(1.5, 0.65, 1);
        const chloroMat = new THREE.MeshPhongMaterial({ color: 0x166534, transparent: true, opacity: 0.18, shininess: 90 });
        const chloroMesh = new THREE.Mesh(chloroGeo, chloroMat);
        chloroMesh.userData = { 
            title: "Kloroplast & Stroma Sıvısı", 
            desc: "Fotosentezin gerçekleştiği organeldir. İçindeki şeffaf sıvıya Stroma denir. Calvin döngüsü burada gerçekleşir." 
        };
        scene.add(chloroMesh);
        clickableObjects.push(chloroMesh);

        // 2. TILAKOİT ZAR (GRANUM KULESİ)
        const granumGroup = new THREE.Group();
        for(let i=0; i<4; i++) {
            const discGeo = new THREE.CylinderGeometry(0.45, 0.45, 0.12, 16);
            const discMat = new THREE.MeshPhongMaterial({ color: 0x22c55e, shininess: 60 });
            const disc = new THREE.Mesh(discGeo, discMat);
            disc.position.set(-2.2, (i * 0.15) - 0.2, 0);
            granumGroup.add(disc);
        }
        granumGroup.userData = { 
            title: "Tilakoit Zar (Granum)", 
            desc: "Işığı emen klorofiller buradadır. Işığa bağımlı reaksiyonlar ve suyun parçalanması bu zarlarda gerçekleşir." 
        };
        scene.add(granumGroup);
        granumGroup.children.forEach(c => { c.userData = granumGroup.userData; clickableObjects.push(c); });

        // 3. ETS ELEKTRON TAŞIMA SİSTEMİ
        const etsGroup = new THREE.Group();
        const etsColors = [0x3b82f6, 0xeab308, 0xef4444, 0x10b981];
        for(let i=0; i<4; i++) {
            const compGeo = new THREE.BoxGeometry(0.3, 0.4, 0.3);
            const compMat = new THREE.MeshPhongMaterial({ color: etsColors[i], shininess: 90 });
            const comp = new THREE.Mesh(compGeo, compMat);
            comp.position.set(-1.3 + (i * 0.48), 0.1, 0.8);
            etsGroup.add(comp);
            comp.userData = { 
                title: "Elektron Taşıma Sistemi (ETS)", 
                desc: "Uyarılan elektronlar bu protein kompleksi boyunca kayarak enerjilerini ATP ve NADPH üretimi için aktarırlar." 
            };
            clickableObjects.push(comp);
        }

        const electronGeo = new THREE.SphereGeometry(0.07, 12, 12);
        const electronMat = new THREE.MeshBasicMaterial({ color: 0xfacc15 });
        const electronMesh = new THREE.Mesh(electronGeo, electronMat);
        electronMesh.position.set(-1.3, 0.38, 0.8);
        scene.add(electronMesh);
        scene.add(etsGroup);

        // 4. ATP SENTAZ MOTORU
        const atpSynthGroup = new THREE.Group();
        const headGeo = new THREE.CylinderGeometry(0.28, 0.28, 0.38, 16);
        const headMat = new THREE.MeshPhongMaterial({ color: 0x38bdf8, shininess: 100 });
        const atpHead = new THREE.Mesh(headGeo, headMat);
        atpSynthGroup.add(atpHead);
        atpSynthGroup.position.set(0.8, 0.2, 0.8);
        atpSynthGroup.userData = { 
            title: "ATP Sentaz Enzimi", 
            desc: "Proton (H+) birikimi ile döner bir motor gibi çalışarak ADP'den ATP sentezleyen hayati enzimdir." 
        };
        scene.add(atpSynthGroup);
        atpHead.userData = atpSynthGroup.userData;
        clickableObjects.push(atpHead);

        // 5. 3D CALVIN DÖNGÜSÜ HALKASI
        const calvinGroup = new THREE.Group();
        const ringGeo = new THREE.TorusGeometry(1.25, 0.05, 16, 50);
        const ringMat = new THREE.MeshBasicMaterial({ color: 0xfacc15, wireframe: true });
        const calvinRing = new THREE.Mesh(ringGeo, ringMat);
        calvinRing.rotation.x = Math.PI / 2;
        calvinGroup.add(calvinRing);

        const nodeColors = [0xef4444, 0x38bdf8, 0x38bdf8, 0x4ade80, 0xfacc15];
        for(let i=0; i<5; i++) {
            const angle = (i / 5) * Math.PI * 2;
            const nGeo = new THREE.SphereGeometry(0.14, 16, 16);
            const nMat = new THREE.MeshPhongMaterial({ color: nodeColors[i] });
            const node = new THREE.Mesh(nGeo, nMat);
            node.position.set(Math.cos(angle)*1.25, 0, Math.sin(angle)*1.25);
            calvinGroup.add(node);
        }
        calvinGroup.position.set(1.6, 0.2, -0.4);
        calvinGroup.userData = { 
            title: "Calvin Döngüsü (Işıktan Bağımsız Evre)", 
            desc: "CO2 molekülünün tutulup ATP/NADPH harcanarak Glikoz (Besin) üretildiği döngüsel reaksiyondur." 
        };
        scene.add(calvinGroup);
        calvinRing.userData = calvinGroup.userData;
        clickableObjects.push(calvinRing);

        // TIKLAMA BİLGİ KUTUSU MANTIĞI
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        window.addEventListener('click', (e) => {
            if(e.target.closest('#ui-panel') || e.target.closest('#info-box')) return;

            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(clickableObjects);

            if(intersects.length > 0) {
                const data = intersects[0].object.userData;
                if(data && data.title) {
                    document.getElementById('info-title').innerText = data.title;
                    document.getElementById('info-desc').innerText = data.desc;
                    document.getElementById('info-box').style.display = 'block';
                }
            }
        });

        document.getElementById('info-close').addEventListener('click', () => {
            document.getElementById('info-box').style.display = 'none';
        });

        // KONTROLLER
        let lightVal = 60, selectedColor = "680", tempVal = 25, co2Val = 50;
        let glucose = 0, atp = 0;

        function updateSceneColor() {
            if (isNight) {
                scene.background = new THREE.Color(0x020617);
                scene.fog = new THREE.FogExp2(0x020617, 0.03);
                lightSource.color.setHex(0x1e293b);
                return;
            }

            let hexColor = 0xef4444; bgHex = 0x1f0505;
            if (selectedColor === "450") { hexColor = 0x3b82f6; bgHex = 0x030f26; }
            else if (selectedColor === "530") { hexColor = 0x22c55e; bgHex = 0x031c0e; }
            else if (selectedColor === "580") { hexColor = 0xeab308; bgHex = 0x1c1703; }
            else if (selectedColor === "white") { hexColor = 0xffffff; bgHex = 0x111827; }

            scene.background = new THREE.Color(bgHex);
            scene.fog = new THREE.FogExp2(bgHex, 0.025);
            lightSource.color.setHex(hexColor);
        }

        document.getElementById('lightSlider').addEventListener('input', (e) => { lightVal = +e.target.value; document.getElementById('light-val').innerText = lightVal + '%'; lightSource.intensity = isNight ? 0 : lightVal / 25; });
        document.getElementById('lightColorSelect').addEventListener('change', (e) => { selectedColor = e.target.value; updateSceneColor(); });
        document.getElementById('tempSlider').addEventListener('input', (e) => { tempVal = +e.target.value; document.getElementById('temp-val').innerText = tempVal + '°C'; });
        document.getElementById('co2Slider').addEventListener('input', (e) => { co2Val = +e.target.value; document.getElementById('co2-val').innerText = co2Val + '%'; });

        document.getElementById('dayNightBtn').addEventListener('click', () => {
            isNight = !isNight;
            const btn = document.getElementById('dayNightBtn');
            if (isNight) {
                btn.innerText = "☀️ Gündüz Modu";
                btn.style.background = "#ca8a04";
                lightSource.intensity = 0.1;
                document.getElementById('etsVal').innerText = "Elektron Akışı Durdu";
                document.getElementById('etsVal').style.color = "#ef4444";
            } else {
                btn.innerText = "🌙 Gece Modu";
                btn.style.background = "#15803d";
                lightSource.intensity = lightVal / 25;
                document.getElementById('etsVal').innerText = "Aktif (e⁻ Akıyor)";
                document.getElementById('etsVal').style.color = "#eab308";
            }
            updateSceneColor();
        });

        updateSceneColor();

        let ePos = -1.3;

        function animate() {
            requestAnimationFrame(animate);

            let colorEfficiency = 0.8;
            if (selectedColor === "680" || selectedColor === "450") colorEfficiency = 1.0;
            else if (selectedColor === "530") colorEfficiency = 0.15;
            else if (selectedColor === "580") colorEfficiency = 0.5;

            let tempFactor = 1 - Math.abs(tempVal - 25) / 25; tempFactor = Math.max(0, tempFactor);
            let currentLight = isNight ? 0 : lightVal / 100;
            
            let rate = currentLight * colorEfficiency * tempFactor * (co2Val / 100) * 100;
            rate = Math.max(0, rate);

            document.getElementById('rateVal').innerText = '%' + Math.round(rate);

            if (rate > 0) {
                ePos += 0.015 * (rate / 50);
                if(ePos > 0.15) ePos = -1.3;
                electronMesh.position.x = ePos;

                atpHead.rotation.y += 0.05 * (rate / 50);
                calvinGroup.rotation.y += (rate / 100) * 0.04 + 0.002;

                glucose += rate * 0.0008;
                atp += Math.floor(rate * 0.1);
                document.getElementById('glucoseVal').innerText = glucose.toFixed(2) + ' mg';
                document.getElementById('atpVal').innerText = `${atp} ATP / ${Math.floor(atp*0.66)} NADPH`;
            }

            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
